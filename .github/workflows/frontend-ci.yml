name: Frontend CI

on:
  pull_request:
    paths:
      - 'ilras-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - 'takeover/**'
    paths:
      - 'ilras-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ilras-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: ilras-frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
