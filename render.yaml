services:
  - type: web
    name: ilras-backend
    runtime: python
    rootDir: ilras-backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m app.seed"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://ilras-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: ilras-frontend
    runtime: static
    rootDir: ilras-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ilras-backend.onrender.com
    routes:
      # React Router uses client-side routing -- without this rewrite,
      # a direct visit or refresh on any route other than "/" (e.g.
      # /district/tapung) would 404 on Render's static file server.
      - type: rewrite
        source: /*
        destination: /index.html
